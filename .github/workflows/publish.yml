                 local ident = to_identifier(label)
                 if node_type == cmark.NODE_LINK then
          @@ -149,7 +168,17 @@ local create_anchors = function(doc, meta, to)
                       number[level] = number[level] + 1
                     end
                   end
          -        table.insert(toc, { label = label, ident = ident, level = level, number = render_number(number) })
          +        local previous = cmark.node_previous(cur)
          +        local extension = previous and cmark.node_get_type(previous) == cmark.NODE_HTML_BLOCK and
          +                          cmark.node_get_literal(previous):match('^<div class="extension ([a-z]+)">%s*$')
          +        dialects = label:match(' %(([A-Z, ]+)%)$')
          +        if dialects then
          +          label = label:gsub(' %([A-Z, ]+%)$', '')
          +          if extension == 'gfm' then
          +            dialects = 'GFM, ' .. dialects
          +          end
          +        end
          +        table.insert(toc, { label = label, ident = ident, level = level, number = render_number(number), dialects = dialects })
                   local num = render_number(number)
                   local section_cmds = {"\\section", "\\subsection",
                                         "\\subsubsection", "\\chapter"}
          @@ -176,12 +205,20 @@ local create_anchors = function(doc, meta, to)
                   child = cmark.node_next(child)
                 end
                 for _,child in ipairs(children) do
          +        if dialects and child == children[#children] and cmark.node_get_type(child) == cmark.NODE_TEXT then
          +          cmark.node_set_literal(child, (cmark.node_get_literal(child):gsub(' %([A-Z, ]+%)$', '')))
          +        end
                   cmark.node_append_child(anchor, child)
                 end
          +      if dialects then
          +        local badges = cmark.node_new(cmark.NODE_CUSTOM_INLINE)
          +        cmark.node_set_on_enter(badges, ' ' .. dialect_badges(dialects))
          +        cmark.node_append_child(anchor, badges)
          +      end
                 cmark.node_insert_before(cur, anchor)
                 cmark.node_unlink(cur)
               elseif entering and node_type == cmark.NODE_CODE_BLOCK and
          -          cmark.node_get_fence_info(cur) == 'example' then
          +          (cmark.node_get_fence_info(cur) == 'example' or cmark.node_get_fence_info(cur):match('^example%s')) then
                 example = example + 1
                  -- split into two code blocks
                 local code = cmark.node_get_literal(cur)
          @@ -214,16 +251,14 @@ local create_anchors = function(doc, meta, to)
                   cmark.node_append_child(leftcol_div, markdown_code)
                   cmark.node_append_child(rightcol_div, html_code)
                   local examplenum_div = make_html_block('div', {{'class', 'examplenum'}})
          -        local interact_link = make_html_inline('a', {{'class', 'dingus'},
          -                    {'title', 'open in interactive dingus'}})
          -        cmark.node_append_child(interact_link, make_text("Try It"))
                   local examplenum_link = cmark.node_new(cmark.NODE_LINK)
                   cmark.node_set_url(examplenum_link, '#example-' .. tostring(example))
                   cmark.node_append_child(examplenum_link,
                                           make_text("Example " .. tostring(example)))
                   cmark.node_append_child(examplenum_div, examplenum_link)
          -        if format == 'html' then
          -          cmark.node_append_child(examplenum_div, interact_link)
          +        local features = trim(cmark.node_get_fence_info(cur):sub(8))
          +        if features ~= '' then
          +          cmark.node_append_child(examplenum_div, make_text(' (' .. features .. ')'))
                   end
                   example_div = make_html_block('div', {{'class', 'example'},
                                            {'id','example-' .. tostring(example)}})
