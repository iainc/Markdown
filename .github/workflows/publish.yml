name: Publish specification

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out specification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check out CommonMark generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: commonmark/commonmark-spec
          ref: 3da939428d80f146f270cd1765e4ba462e96bb1b
          path: _commonmark
          persist-credentials: false

      - name: Install generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4 liblua5.4-dev luarocks libyaml-dev build-essential python3
          sudo luarocks --lua-version=5.4 install https://luarocks.org/manifests/gvvaughan/optparse-1.6-1.src.rock
          sudo luarocks --lua-version=5.4 install lcmark 0.31.1-1
          sudo luarocks --lua-version=5.4 install lyaml 6.2.8-1

      - name: Generate specification
        run: |
          git -C _commonmark apply - <<'PATCH'
          diff --git a/tools/make_spec.lua b/tools/make_spec.lua
          index 1ff19d908e..303bbf146a 100644
          --- a/tools/make_spec.lua
          +++ b/tools/make_spec.lua
          @@ -58,16 +58,28 @@ local extract_references = function(doc)
             return refs
           end
           
