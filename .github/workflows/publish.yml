          +<div class="version">Version: $version$<br>Date: $date$</div>
          +<div class="base-versions">CommonMark: <a href="https://spec.commonmark.org/$commonmark-version$/">$commonmark-version$</a><br>GFM: <a href="https://github.github.com/gfm/">$gfm-version$</a></div>
          +<div class="license">License: $license$<br>Source: $source$</div>
