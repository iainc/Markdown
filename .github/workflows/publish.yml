          +    badges[#badges + 1] = '<span class="dialect ' .. dialect:lower() .. '">' .. dialect .. '</span>'
          +  end
          +  return '<span class="dialects">' .. table.concat(badges, ' ') .. '</span>'
          +end
          +
           local make_toc = function(toc)
             -- we create a commonmark string, then parse it
             local toclines = {}
             for _,entry in ipairs(toc) do
               if entry.level <= 2 then
                 local indent = string.rep('    ', entry.level - 1)
          -      toclines[#toclines + 1] = indent .. '* [' ..
          +      local link = '[' ..
                   (entry.number == '' and ''
                     or '<span class="number">' .. entry.number .. '</span>') ..
                    entry.label ..  '](#' .. entry.ident .. ')'
          +      if entry.dialects then
          +        link = link .. ' ' .. dialect_badges(entry.dialects)
          +      end
          +      toclines[#toclines + 1] = indent .. '* ' .. link
               end
             end
             -- now parse our cm list and return the resulting list node:
          @@ -75,12 +87,19 @@ local make_toc = function(toc)
             return cmark.node_first_child(doc)
           end
           
          +local html_identifiers = {}
          +
