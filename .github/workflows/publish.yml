          PATCH
          mkdir -p _site
          (cd _commonmark && lua5.4 tools/make_spec.lua html < ../spec.txt) > _site/index.html
          cp spec.txt LICENSE.txt _site/
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = Counter()
                  self.links = set()
                  self.examples = 0

              def handle_starttag(self, tag, attributes):
                  attributes = dict(attributes)
                  if 'id' in attributes:
                      self.ids[attributes['id']] += 1
                  if tag == 'a' and attributes.get('href', '').startswith('#'):
                      self.links.add(attributes['href'][1:])
                  if tag == 'div' and attributes.get('class') == 'example':
                      self.examples += 1

          page = Page()
          page.feed(Path('_site/index.html').read_text())
          expected = len(re.findall(r'^`{32} example', Path('spec.txt').read_text(), re.M))
          duplicates = [name for name, count in page.ids.items() if count > 1]
          missing = page.links - page.ids.keys()
          if page.examples != expected or duplicates or missing:
              raise SystemExit(f'Examples: {page.examples}/{expected}; duplicate IDs: {duplicates}; missing anchors: {sorted(missing)}')
          print(f'Validated {page.examples} examples and {len(page.links)} internal links.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
